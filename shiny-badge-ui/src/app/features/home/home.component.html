<div class="container">
  <header class="home-header">
    <h1>Explore Badges</h1>
    <p class="subtitle">Discover goals to challenge yourself and grow.</p>
  </header>

  <div class="badge-grid" *ngIf="currentUser(); else welcomeMessage">
    @for (badge of badges(); track badge.id) {
    <app-card [badge]="badge"></app-card>
    }
  </div>

  <ng-template #welcomeMessage>
    <div class="welcome-container">
      <h2>Welcome to Shiny Badge!</h2>
      <p>Track your achievements and grow your skills.</p>
      <p>Please log in to view your badges and start your journey.</p>
    </div>
  </ng-template>
</div>
