<mat-sidenav-container>
  <mat-sidenav #sidenav [opened]="sidenavOpen()" (closed)="sidenavOpen.set(false)" mode="over">
    <mat-nav-list>
      <a mat-list-item routerLink="/home" (click)="sidenavOpen.set(false)">Home</a>
      <a mat-list-item routerLink="/about" (click)="sidenavOpen.set(false)">About</a>
      <a mat-list-item routerLink="/contact" (click)="sidenavOpen.set(false)">Contact</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button *ngIf="isMobile" mat-icon-button (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Shiny Badge</span>
      <div class="spacer"></div>
      <ng-container *ngIf="!isMobile">
        <button mat-button routerLink="/home">Home</button>
        <button mat-button routerLink="/about">About</button>
        <button mat-button routerLink="/contact">Contact</button>
      </ng-container>

      <ng-container *ngIf="currentUser(); else loginButton">
        <button mat-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
          {{ currentUser()?.username }}
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item routerLink="/account">
            <mat-icon>person</mat-icon>
            <span>Account</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon>exit_to_app</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </ng-container>

      <ng-template #loginButton>
        <button mat-button (click)="openLogin()">Login</button>
      </ng-template>
    </mat-toolbar>
    <ng-content></ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
